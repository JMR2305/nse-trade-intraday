[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intraday-trading-bot"
version = "2.0.1"
description = "Production-grade paper-first intraday trading platform for Indian NSE markets"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Trading Platform Team"}
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "python-multipart==0.0.32",
    "python-dotenv==1.0.1",

    # Authentication
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",

    # Database
    "sqlalchemy[asyncio]==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",

    # Data processing
    "numpy==1.26.4",
    "pandas==2.2.2",

    # Logging
    "python-json-logger==2.0.7",

    # Utilities
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "pyyaml==6.0.1",
    "httpx==0.27.0",
    "aiosqlite==0.20.0",

    # Broker integration
    "kiteconnect>=5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "aiosqlite==0.20.0",
    "black==26.5.1",
    "flake8==7.0.0",
    "mypy==1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ packages import each other with bare names (e.g. `from execution.
# contracts import ...`), so src must be importable directly. NOTE: the
# root conftest also imports via the `src.` prefix — code touching ORM
# models must keep the documented try/except double-import guard.
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
