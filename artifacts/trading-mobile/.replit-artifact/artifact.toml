kind = "mobile"
previewPath = "/trading-mobile/"
title = "NSE Trading Mobile"
version = "1.0.0"
id = "artifacts/trading-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/trading-mobile/" ]
localPort = 21338

[services.development]
run = "pnpm --filter @workspace/trading-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trading-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/trading-mobile", "run", "serve" ]

[services.env]
PORT = "21338"
BASE_PATH = "/trading-mobile/"
