<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- ── Primary metadata ── -->
    <title>ApexQuant AI — AI-Powered NSE Trading Platform</title>
    <meta name="description" content="ApexQuant AI is an AI-powered NSE paper-trading and portfolio analytics platform." />
    <meta name="application-name" content="ApexQuant AI" />
    <meta name="robots" content="index, follow" />

    <!-- ── Theme ── -->
    <meta name="theme-color" content="#17395F" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1626"  media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- ── Open Graph ── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="ApexQuant AI" />
    <meta property="og:title"       content="ApexQuant AI — AI-Powered NSE Trading Platform" />
    <meta property="og:description" content="ApexQuant AI is an AI-powered NSE paper-trading and portfolio analytics platform." />
    <meta property="og:locale"      content="en_IN" />

    <!-- ── Twitter / X ── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="ApexQuant AI — AI-Powered NSE Trading Platform" />
    <meta name="twitter:description" content="ApexQuant AI is an AI-powered NSE paper-trading and portfolio analytics platform." />

    <!-- ── PWA / Icons ── -->
    <!-- Root-relative URLs: Vite prepends its base (/trading-dashboard/) to
         index.html URLs automatically — hardcoding the prefix doubles it. -->
    <link rel="icon"             type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/branding/apexquant-ai-logo.png" />
    <link rel="manifest"         href="/manifest.webmanifest" />

    <!-- ── Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
