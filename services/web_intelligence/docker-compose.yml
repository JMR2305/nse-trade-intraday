services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: web_intelligence
      POSTGRES_USER: wi_user
      POSTGRES_PASSWORD: wi_password
    volumes:
      - wi_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    # TCP-probe waits for Postgres then runs Alembic.
    # Written as a single sh -c line to avoid YAML multi-line escaping issues.
    command: sh -c "python -c 'import socket,sys,time;[(socket.create_connection((\"postgres\",5432),2), sys.exit(0)) if True else None for _ in range(30) if not time.sleep(2)]' ; alembic upgrade head"
    environment:
      - DATABASE_URL=postgresql+asyncpg://wi_user:wi_password@postgres:5432/web_intelligence
    depends_on:
      - postgres
    restart: on-failure

  web-intelligence:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://wi_user:wi_password@postgres:5432/web_intelligence
      - SNAPSHOT_STORAGE_DIR=/app/snapshots
      - LOG_LEVEL=INFO
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8000
      - PRODUCTION_MODE=true
      - ALLOW_HTTP_FOR_TESTS=false
      - STRICT_CONTENT_TYPE_VALIDATION=true
      - MAXIMUM_RESPONSE_SIZE_BYTES=10485760
      - REQUEST_TIMEOUT_SECONDS=30
      - RETRY_COUNT=3
      - MAX_REDIRECTS=5
    volumes:
      - wi_snapshots:/app/snapshots
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  wi_pg_data:
  wi_snapshots:
