version: "3.8"

services:
  web-intelligence:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/web_intelligence.db
      - SNAPSHOT_STORAGE_DIR=/app/snapshots
      - LOG_LEVEL=INFO
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8000
      - PRODUCTION_MODE=true
      - ALLOW_HTTP_FOR_TESTS=false
      - STRICT_CONTENT_TYPE_VALIDATION=true
      - MAXIMUM_RESPONSE_SIZE_BYTES=10485760
      - REQUEST_TIMEOUT_SECONDS=30
      - RETRY_COUNT=3
      - MAX_REDIRECTS=5
    volumes:
      - wi_data:/app/data
      - wi_snapshots:/app/snapshots
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  wi_data:
  wi_snapshots:
