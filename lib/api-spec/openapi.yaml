        skipped_symbols:
          type: array
          items: { type: string }
        adaptive_model_version:
          type: integer
        knowledge_trades_available:
          type: integer
        similarity_vectors_available:
          type: integer
        windows:
          type: array
          items:
            type: object
            additionalProperties: true
        overall:
          type: object
          additionalProperties: true
        layer_comparison:
          type: array
          items:
            type: object
            additionalProperties: true
        benchmarks:
          type: object
          additionalProperties: true
        calibration:
          type: array
          items:
            type: object
            additionalProperties: true
        recommendation_outcomes:
          type: array
          items:
            type: object
            additionalProperties: true
        recommendations_issued:
          type: integer
        stability:
          type: object
          additionalProperties: true
        verdict:
          type: object
          additionalProperties: true
        cost_breakdown:
          type: object
          additionalProperties: true
        equity_curve:
          type: array
          items:
