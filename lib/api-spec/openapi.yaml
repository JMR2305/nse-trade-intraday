    WalkForwardConfig:
      type: object
      description: >
        Configuration for a walk-forward validation run. All fields optional;
        omitted values use safe defaults. Cost assumptions are fully visible
        and editable.
      properties:
        train_years:
          type: integer
          enum: [1, 2, 3]
          default: 1
        test_months:
          type: integer
          enum: [1, 3, 6]
          default: 3
        step_months:
          type: integer
          enum: [1, 3]
          default: 3
        start_date:
          type: string
          description: First training-window start (YYYY-MM-DD). Auto when empty.
        end_date:
          type: string
          description: Last test-window end (YYYY-MM-DD). Auto when empty.
        initial_capital:
          type: number
          default: 5000
        universe:
          type: array
          items: { type: string }
          description: Stock symbols to include. Empty → full NIFTY 50.
        universe_size:
          type: integer
          description: When > 0, only the first N symbols of the universe are tested (quicker runs).
        strategy_set:
          type: array
          items: { type: string }
          description: Strategy ids to include. Empty → all lab strategies.
        cost_model:
          type: object
          additionalProperties: true
          description: >
            Execution-cost assumptions (percent units): slippage_pct,
            spread_pct, brokerage_pct, brokerage_flat, brokerage_max, stt_pct,
            exchange_pct, sebi_pct, stamp_pct, gst_pct,
            volume_participation_pct, allow_partial_fills, max_entry_gap_pct.
        intrabar_rule:
          type: string
          enum: [conservative, optimistic]
          default: conservative
        max_holding_days:
          type: integer
          default: 20
        min_confidence_execute:
          type: number
          default: 55
        verdict_criteria:
          type: object
          additionalProperties: true
          description: >
            Verdict thresholds: min_expectancy, min_profit_factor,
            max_drawdown_pct, require_full_beats_base,
            max_single_stock_profit_share, max_single_window_profit_share,
            min_trades, min_windows.
        random_seed:
          type: integer
          default: 42

    WalkForwardStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: idle | running | completed | failed
        phase:
          type: string
        progress_pct:
          type: number
        windows_total:
          type: integer
        windows_done:
          type: integer
        started_at:
          type: string
        updated_at:
          type: string
        error:
