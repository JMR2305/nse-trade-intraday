openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trading
    description: Paper trading operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /portfolio:
    get:
      operationId: getPortfolio
      tags: [trading]
      summary: Get portfolio state
      description: Returns cash, positions, P&L, and portfolio value in INR
      responses:
        "200":
          description: Portfolio state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /signals:
    get:
      operationId: getSignals
      tags: [trading]
      summary: Get cached signals
      description: Returns signals from the last scan
      responses:
        "200":
          description: List of signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trades:
    get:
      operationId: getTrades
      tags: [trading]
      summary: Get trade history
      description: Returns all paper trades, newest first
      responses:
        "200":
          description: Trade history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /run-scan:
    post:
      operationId: runScan
      tags: [trading]
      summary: Run signal scan
      description: Scans the watchlist for signals using the latest market data
      responses:
        "200":
          description: Scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /watchlist:
    get:
      operationId: getWatchlist
      tags: [trading]
      summary: Get watchlist
      description: Returns current NSE symbol watchlist
      responses:
        "200":
          description: Watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addToWatchlist
      tags: [trading]
      summary: Add symbol to watchlist
      description: Adds an NSE symbol to the watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistAddRequest"
      responses:
        "200":
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /watchlist/{symbol}:
    delete:
      operationId: removeFromWatchlist
      tags: [trading]
      summary: Remove symbol from watchlist
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /opportunity-scan:
    get:
      operationId: getOpportunityScan
      tags: [trading]
      summary: Get ranked opportunity scan
      description: Returns all watchlist stocks ranked by opportunity score
      responses:
        "200":
          description: Ranked opportunity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpportunityItem"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market-scan:
    get:
      operationId: getMarketScan
      tags: [trading]
      summary: Sprint 1.5 — scan the full NIFTY 50 universe
      description: >
        Scans all NIFTY 50 stocks, runs every validated strategy per stock,
        selects the best-performing one, ranks opportunities, computes
        sector strength, builds the dynamic AI watchlist, heat map, and
        dashboard summary. Paper trading only — no real orders are placed.
      responses:
        "200":
          description: Full market scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketScanResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market-replay:
    get:
      operationId: getMarketReplay
      tags: [trading]
      summary: Historical Market Scanner / Market Replay
      description: >
        Runs the market scanner as if a chosen past date were "today",
        using only data available up to that date to generate signals,
        then compares each signal with what actually happened over the
        chosen holding period. Paper trading only — no real orders.
      parameters:
        - name: scan_date
          in: query
          required: true
          description: Historical date to scan, in YYYY-MM-DD format
          schema:
            type: string
        - name: holding_period
          in: query
          required: false
          description: Holding period in trading days
          schema:
            type: integer
            enum: [1, 3, 5, 10]
            default: 5
        - name: interval
          in: query
          required: false
          schema:
            type: string
            enum: [daily, hourly]
            default: daily
      responses:
        "200":
          description: Historical replay result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketReplayResult"
        "400":
          description: Invalid scan_date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market-context:
    get:
      operationId: getMarketContext
      tags: [trading]
      summary: Get market context
      description: Returns synthesised market score, bias, and sector strength
      responses:
        "200":
          description: Market context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketContext"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market-data/{symbol}:
    get:
      operationId: getMarketData
      tags: [trading]
      summary: Get OHLCV candle data
      description: Fetches historical candles for an NSE symbol via yfinance (mock fallback)
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
        - name: interval
          in: query
          schema: { type: string, default: "1d" }
        - name: period
          in: query
          schema: { type: string, default: "3mo" }
      responses:
        "200":
          description: OHLCV candle data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /indicators/{symbol}:
    get:
      operationId: getIndicators
      tags: [trading]
      summary: Get computed technical indicators
      description: Returns EMA, RSI, MACD, VWAP, ATR, ADX, BB, Supertrend snapshot + series
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
        - name: interval
          in: query
          schema: { type: string, default: "1d" }
        - name: period
          in: query
          schema: { type: string, default: "3mo" }
      responses:
        "200":
          description: Indicator result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicatorResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /backtest:
    post:
      operationId: runBacktest
      tags: [trading]
      summary: Run a paper backtest
      description: Walk-forward simulation of a strategy on historical data. No real orders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestRequest"
      responses:
        "200":
          description: Backtest result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /strategies:
    get:
      operationId: getStrategies
      tags: [trading]
      summary: List available strategies
      description: Returns all registered trading strategies with their rules
      responses:
        "200":
          description: Strategy list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyInfo"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai-decisions:
    get:
      operationId: getAiDecisions
      tags: [trading]
      summary: Get cached AI decisions
      description: Returns AI Decision Engine results from the last scan
      responses:
        "200":
          description: List of AI decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiDecision"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trade-replay:
    get:
      operationId: getTradeReplay
      tags: [trading]
      summary: Get trade replay data
      description: Returns completed BUY→SELL round trips with full metadata
      responses:
        "200":
          description: Trade replay items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeReplayItem"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learning-summary:
    get:
      operationId: getLearningSummary
      tags: [trading]
      summary: Strategy Learning Engine summary
      description: >
        Per-strategy reliability metrics (win rate, profit factor, expectancy) computed
        from the Trade Journal, plus a recommended relative allocation weight adjustment.
        Recommendation only — no orders are placed or modified automatically.
      responses:
        "200":
          description: Learning summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSummary"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /paper-basket:
    post:
      operationId: runPaperBasket
      tags: [trading]
      summary: Paper Basket Testing Layer
      description: >
        Simulates buying a basket of stocks selected from the previous
        trading day's data (no lookahead bias), then paper-buys at the next
        trading day's open and paper-sells after the chosen holding period
        at close. Paper trading only — no real orders are ever placed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperBasketRequest"
      responses:
        "200":
          description: Paper basket result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperBasketResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trade-intelligence:
    get:
      operationId: getTradeIntelligence
      tags: [trading]
      summary: Trade Intelligence Database
      description: >
        Historical database of every completed paper trade (Paper Basket Test,
        Paper Trades, Historical Replay) with indicators at entry, AI metrics,
        and win/loss classification. Storage only — no AI learning here.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
          description: Maximum number of trades to return.
      responses:
        "200":
          description: Trade intelligence data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeIntelligenceResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trade-intelligence/import:
    post:
      operationId: importTradeIntelligence
      tags: [trading]
      summary: Backfill the Trade Intelligence Database
      description: >
        Imports completed trades from the existing paper portfolio history.
        Paper Basket Tests and Historical Replays are recorded automatically
        each time they run.
      responses:
        "200":
          description: Import result with updated summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeIntelligenceImportResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /predictive-intelligence/{symbol}:
    get:
      operationId: getPredictiveIntelligence
      tags: [trading]
      summary: Historical evidence for a symbol
      description: >
        Predictive Intelligence Engine — builds a candidate setup for the
        symbol from live indicators, sector, current market regime and cached
        AI metrics, then compares it with similar historical trades in the
        Trade Intelligence database. Evidence layer only — existing scanner
        logic is unchanged and no orders are placed.
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: NSE symbol, e.g. RELIANCE.
      responses:
        "200":
          description: Historical evidence summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictiveEvidenceResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /historical-knowledge/build:
    post:
      operationId: buildHistoricalKnowledge
      tags: [trading]
      summary: Start a Historical Knowledge Base build
      description: >
        Simulates all existing strategies on NIFTY 50 stocks using Yahoo
        Finance history (1, 3 or 5 years) and stores every simulated trade
        with market context, indicator snapshots and decision metrics.
        Research only — no orders. The build runs in the background; poll
        the summary endpoint for progress.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                years:
                  type: integer
                  enum: [1, 3, 5]
                  default: 5
      responses:
        "200":
          description: Build started
          content:
            application/json:
              schema:
                type: object
                required: [started, years, status]
                properties:
                  started:
                    type: boolean
                  years:
                    type: integer
                  status:
                    type: string
        "409":
          description: A build is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /historical-knowledge/summary:
    get:
      operationId: getHistoricalKnowledgeSummary
      tags: [trading]
      summary: Historical Knowledge Base summary and build status
      responses:
        "200":
          description: Aggregated knowledge base statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalKnowledgeSummary"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /walk-forward/run:
    post:
      operationId: runWalkForwardValidation
      tags: [trading]
      summary: Start a walk-forward validation run
      description: >
        Tests the complete decision engine on unseen historical periods using
        rolling train/test windows with realistic execution costs (slippage,
        brokerage, STT, GST, spread, partial fills). Long-running background
        process — poll the status endpoint. Research only, no orders.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalkForwardConfig"
      responses:
        "200":
          description: Validation run started
          content:
            application/json:
              schema:
                type: object
                required: [started, status]
                properties:
                  started:
                    type: boolean
                  status:
                    type: string
        "409":
          description: A validation run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /walk-forward/status:
    get:
      operationId: getWalkForwardStatus
      tags: [trading]
      summary: Walk-forward validation progress
      responses:
        "200":
          description: Current run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalkForwardStatus"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /walk-forward/result:
    get:
      operationId: getWalkForwardResult
      tags: [trading]
      summary: Latest completed walk-forward validation result
      responses:
        "200":
          description: Full validation report (or available=false when none exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalkForwardResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /walk-forward/export/{kind}:
    get:
      operationId: exportWalkForwardCsv
      tags: [trading]
      summary: Download a walk-forward validation CSV export
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [report, trades, windows, calibration, costs]
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Unknown export kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No export available yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /historical-knowledge/trades:
    get:
      operationId: getHistoricalKnowledgeTrades
      tags: [trading]
      summary: List simulated historical trades
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: symbol
          in: query
          schema: { type: string }
        - name: strategy
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Simulated trades page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalKnowledgeTrades"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trade-decisions:
    get:
      operationId: getTradeDecisions
      tags: [trading]
      summary: One clear recommendation per stock (Decision Dashboard)
      description: >
        Combines the scanner, expectancy engine, adaptive learning and paper
        portfolio into one deterministic recommendation per stock
        (STRONG_BUY / BUY / WATCH / EXIT / AVOID). Runs a full universe scan
        (~20-30s) and caches the result briefly. Paper trading only.
      parameters:
        - name: force
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"] }
          description: Set to "true" to bypass the server-side cache.
      responses:
        "200":
          description: Ranked trade decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeDecisionsResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /evidence-research:
    get:
      operationId: getEvidenceResearch
      tags: [trading]
      summary: Evidence-based similarity research for every stock
      description: >
        v2.1 Evidence-Based Research Engine. Compares each stock's CURRENT
        setup with historically similar setups from the knowledge base using
        a weighted similarity score (0-100), and returns evidence statistics,
        a reliability tier (VERY_LOW/LOW/MEDIUM/HIGH) and the bounded,
        explainable confidence adjustment applied to the trade decision.
        Deterministic and auditable; similarity never guarantees outcomes.
        Runs the full decision pipeline (~20-30s) and caches briefly.
        Paper trading and research only.
      parameters:
        - name: refresh
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"] }
          description: Set to "true" to bypass the server-side cache.
      responses:
        "200":
          description: Similarity evidence per stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResearchResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /feature-importance:
    get:
      operationId: getFeatureImportance
      tags: [trading]
      summary: Rolling feature-importance report (Root Cause Intelligence)
      description: >
        v2.2 Root Cause Intelligence. Shows which indicators consistently
        predicted success across all completed historical trades — ranked
        importance, contribution percentages, trends (gaining/losing
        importance over time), sample sizes and confidence. Also reports the
        dynamic similarity-weight status: weights rebalance gradually from
        evidence, only after at least 50 new completed trades, and no single
        trade can significantly alter the model. Deterministic and auditable.
        Paper trading and research only.
      parameters:
        - name: refresh
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"] }
          description: Set to "true" to bypass the server-side cache.
      responses:
        "200":
          description: Feature importance report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureImportanceResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolio-manager:
    get:
      operationId: getPortfolioManager
      tags: [trading]
      summary: One portfolio-level decision per refresh (Portfolio Manager)
      description: >
        v3.0 Portfolio Manager. Ranks the whole NSE-50 universe by expected
        risk-adjusted return, selects only the top opportunities, sizes
        positions dynamically (half-Kelly, confidence-scaled) under hard caps
        (max 20% per stock, 30% per sector, max 5 new positions unless
        confidence is exceptional), computes portfolio-level metrics, and
        tracks AI allocation vs an equal-weight benchmark. Runs a full
        universe scan (~20-30s) and caches the result briefly. Paper trading
        only — never places orders.
      parameters:
        - name: refresh
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"] }
          description: Set to "true" to bypass the server-side cache.
      responses:
        "200":
          description: Portfolio decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioManagerResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pattern-quality:
    get:
      operationId: getPatternQuality
      tags: [trading]
      summary: Pattern Quality dashboard data (Expectancy Engine)
      description: >
        Every strategy × sector × regime pattern with the full expectancy
        metric set (avg win/loss, profit factor, expectancy, Kelly, Sharpe,
        Sortino, drawdown, holding days), ranked by expectancy. Research only.
      responses:
        "200":
          description: Ranked pattern quality table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternQuality"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learning-insights:
    get:
      operationId: getLearningInsights
      tags: [trading]
      summary: Adaptive Learning insights dashboard data
      description: >
        Deterministic aggregations over the Historical Knowledge Base —
        top/worst patterns, best strategies by sector and regime,
        most/least reliable setups, and four heatmaps. Research only.
      responses:
        "200":
          description: Learning insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningInsights"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learning-review:
    get:
      operationId: getLearningReview
      tags: [trading]
      summary: Learning Review — v2.0 Adaptive Self-Evaluation report
      description: >
        Full self-evaluation report — every evaluated paper trade with its
        prediction snapshot, prediction vs actual outcome, MFE/MAE,
        evidence-based failure causes and success factors, confidence
        calibration bands, proposed (never auto-applied) learning
        adjustments, and model version history. Read-only; paper trading
        research only.
      responses:
        "200":
          description: Learning review payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningReview"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learning-cycle:
    post:
      operationId: runLearningCycle
      tags: [trading]
      summary: Run a learning cycle (Analysis Mode — applies nothing)
      description: >
        Evaluates any pending completed trades, aggregates learn-eligible
        outcomes, and (re)computes PROPOSED adjustments. Analysis Mode only —
        no adjustment is ever applied without explicit approval, and mock-data
        trades are never learned from.
      responses:
        "200":
          description: Learning cycle result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCycleResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learning-adjustments/{id}/approve:
    post:
      operationId: approveLearningAdjustment
      tags: [trading]
      summary: Approve a proposed learning adjustment
      description: >
        Runs out-of-sample validation first; the adjustment is applied (as a
        new model version) only if the proposed model does not worsen
        expectancy, profit factor, max drawdown or risk-adjusted return on
        unseen data. Failing validation auto-rejects the proposal.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Approval outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningActionResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learning-adjustments/{id}/reject:
    post:
      operationId: rejectLearningAdjustment
      tags: [trading]
      summary: Reject a proposed learning adjustment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Rejection outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningActionResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hypotheses/{id}/approve:
    post:
      operationId: approveHypothesis
      tags: [trading]
      summary: Approve a v2.1 hypothesis (validated out-of-sample, then applied)
      description: >
        Runs out-of-sample validation first; the hypothesis is applied (as a
        bounded new model version, max ±3 points per step) only if it does not
        worsen expectancy, profit factor, max drawdown or risk-adjusted return
        on unseen data. Failing validation auto-rejects the hypothesis.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Approval outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningActionResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hypotheses/{id}/reject:
    post:
      operationId: rejectHypothesis
      tags: [trading]
      summary: Reject a v2.1 hypothesis
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Rejection outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningActionResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learning-rollback/{version}:
    post:
      operationId: rollbackModelVersion
      tags: [trading]
      summary: Roll back a model version
      description: >
        Marks the given model version (and any later ones) as rolled back and
        restores the previous surviving version's weights.
      parameters:
        - name: version
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Rollback outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningActionResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trade-evaluations:
    get:
      operationId: getTradeEvaluations
      tags: [trading]
      summary: Evaluated completed paper trades (prediction vs actual)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 200 }
      responses:
        "200":
          description: Trade evaluations with prediction snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeEvaluation"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /predictive-intelligence/evaluate:
    post:
      operationId: evaluatePredictiveIntelligence
      tags: [trading]
      summary: Evaluate an explicit candidate setup
      description: >
        Compares an explicit candidate trade setup (symbol plus any known
        indicator / AI-metric values) against similar historical trades.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictiveCandidate"
      responses:
        "200":
          description: Historical evidence summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictiveEvidenceResult"
        "400":
          description: Invalid candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /optimizer:
    post:
      operationId: runOptimizer
      tags: [trading]
      summary: Strategy Optimizer — test all parameter combinations, return top 10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizerRequest"
      responses:
        "200":
          description: Top N ranked parameter combinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OptimizerResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /strategy-lab:
    post:
      operationId: runStrategyLab
      tags: [trading]
      summary: Strategy Lab — compare all strategies on the same historical data
      description: >
        Fetches OHLCV data once, computes indicators once, then runs all 6
        strategies (EMA Cross, MACD Cross, Mean Reversion, Trend Rider,
        Breakout Hunter, Supertrend) sequentially. Returns a comparison table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyLabRequest"
      responses:
        "200":
          description: Array of per-strategy results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyLabEntry"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /strategy-performance:
    get:
      operationId: getStrategyPerformance
      tags: [trading]
      summary: Get strategy performance metrics
      description: Returns aggregated win rate, profit factor, best stock, etc.
      responses:
        "200":
          description: Strategy performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyPerformance"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market-overview:
    get:
      operationId: getMarketOverview
      tags: [trading]
      summary: Get market intelligence overview
      description: Returns NIFTY/BANKNIFTY trends, VIX, market regime, and top/weak stocks
      responses:
        "200":
          description: Market overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketOverview"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolio/reset:
    post:
      operationId: resetPortfolio
      tags: [trading]
      summary: Reset portfolio
      description: Resets portfolio to initial ₹5,000 capital with no positions
      responses:
        "200":
          description: Reset confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Signal:
      type: object
      properties:
        stock:
          type: string
          description: NSE symbol
        time:
          type: string
          description: ISO datetime of signal generation
        signal:
          type: string
          enum: [STRONG_BUY, BUY, WATCH, SELL, STRONG_SELL, NO_TRADE]
        quantity:
          type: integer
          description: Suggested number of shares based on available capital
        price:
          type: number
          description: Last traded price in INR
        confidence:
          type: number
          description: Signal confidence score 0–100
        reasons:
          type: array
          items:
            type: string
          description: List of indicator reasons supporting the signal
        risk_level:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          description: Risk level based on ATR volatility
        stop_loss:
          type: number
          description: ATR-based stop loss price in INR
        target:
          type: number
          description: ATR-based target price in INR
        explanation:
          $ref: "#/components/schemas/Explanation"
        timeframe_alignment:
          type: integer
          description: Number of timeframes (0-4) that agree with signal direction
        regime:
          type: string
          description: Market regime active at signal generation time
      required:
        - stock
        - time
        - signal
        - quantity
        - price
        - confidence
        - reasons
        - risk_level
        - stop_loss
        - target
        - explanation
        - timeframe_alignment
        - regime

    Position:
      type: object
      properties:
        symbol:
          type: string
        quantity:
          type: integer
        avg_price:
          type: number
        current_price:
          type: number
        pnl:
          type: number
          description: Unrealised P&L in INR
        pnl_pct:
          type: number
          description: Unrealised P&L percentage
      required:
        - symbol
        - quantity
        - avg_price
        - current_price
        - pnl
        - pnl_pct

    PnlPoint:
      type: object
      properties:
        timestamp:
          type: string
        value:
          type: number
      required:
        - timestamp
        - value

    Portfolio:
      type: object
      properties:
        cash:
          type: number
          description: Available cash in INR
        total_value:
          type: number
          description: Total portfolio value (cash + market value of positions)
        invested_value:
          type: number
          description: Current market value of all open positions
        total_pnl:
          type: number
          description: Overall P&L since inception in INR
        total_pnl_pct:
          type: number
          description: Overall P&L percentage since inception
        positions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        pnl_history:
          type: array
          items:
            $ref: "#/components/schemas/PnlPoint"
      required:
        - cash
        - total_value
        - invested_value
        - total_pnl
        - total_pnl_pct
        - positions
        - pnl_history

    Trade:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        action:
          type: string
          enum: [BUY, SELL]
        quantity:
          type: integer
        price:
          type: number
        total:
          type: number
        timestamp:
          type: string
        reason:
          type: string
      required:
        - id
        - symbol
        - action
        - quantity
        - price
        - total
        - timestamp
        - reason

    TradeQuality:
      type: object
      properties:
        trend_score:    { type: number }
        momentum_score: { type: number }
        volume_score:   { type: number }
        breakout_score: { type: number }
        risk_score:     { type: number }
        market_score:   { type: number }
        total_score:    { type: number }
        grade:          { type: string }
      required:
        - trend_score
        - momentum_score
        - volume_score
        - breakout_score
        - risk_score
        - market_score
        - total_score
        - grade

    PositionSizing:
      type: object
      properties:
        capital:                 { type: number }
        available_cash:          { type: number }
        max_risk_amount:         { type: number }
        stop_distance:           { type: number }
        stop_distance_pct:       { type: number }
        suggested_quantity:      { type: integer }
        position_value:          { type: number }
        expected_profit:         { type: number }
        max_loss:                { type: number }
        rr_ratio:                { type: number }
        capital_utilization_pct: { type: number }
        feasible:                { type: boolean }
        sizing_note:             { type: string }
      required:
        - capital
        - available_cash
        - max_risk_amount
        - stop_distance
        - stop_distance_pct
        - suggested_quantity
        - position_value
        - expected_profit
        - max_loss
        - rr_ratio
        - capital_utilization_pct
        - feasible
        - sizing_note

    ExplainabilityReport:
      type: object
      properties:
        approve_reasons:  { type: array, items: { type: string } }
        avoid_reasons:    { type: array, items: { type: string } }
        recommendation:   { type: string }
        final_confidence: { type: number }
        summary:          { type: string }
        one_liner:        { type: string }
      required:
        - approve_reasons
        - avoid_reasons
        - recommendation
        - final_confidence
        - summary
        - one_liner

    ScanItem:
      type: object
      properties:
        rank:               { type: integer }
        stock:              { type: string }
        sector:             { type: string }
        price:              { type: number }
        best_strategy_id:   { type: string }
        best_strategy_name: { type: string }
        strategy_type:      { type: string }
        best_regime:        { type: string }
        strategies_tested:  { type: integer }
        live_signal:        { type: boolean }
        signal_reason:      { type: string }
        opportunity_score:  { type: number }
        trade_quality:      { type: number }
        confidence:         { type: number }
        expected_risk:      { type: number }
        expected_reward:    { type: number }
        rr_ratio:           { type: number }
        final_action:
          type: string
          enum: [STRONG BUY, BUY, WATCH, IGNORE]
        heat:
          type: string
          enum: [GREEN, YELLOW, RED]
        win_rate:      { type: number }
        profit_factor: { type: number }
        net_pnl_pct:   { type: number }
        total_trades:  { type: integer }
        sharpe_ratio:  { type: number }
        entry_price:   { type: number }
        stop_loss:     { type: number }
        target:        { type: number }
        adx:           { type: number }
        # Adaptive Learning Layer (Sprint 3 Module 3)
        base_confidence:           { type: number }
        historical_trades:         { type: integer }
        historical_win_rate:       { type: number }
        historical_profit_factor:  { type: number }
        historical_avg_return:     { type: number }
        historical_expectancy:     { type: number }
        # Expectancy Engine (Sprint 4)
        historical_expectancy_rating:
          type: string
          enum: [Excellent, Good, Neutral, Poor, Negative]
        historical_kelly:          { type: number }
        historical_avg_win:        { type: number }
        historical_avg_loss:       { type: number }
        expected_drawdown:         { type: number }
        expected_holding_days:     { type: number }
        historical_sharpe:         { type: number }
        learning_adjustment:       { type: number }
        final_confidence:          { type: number }
        learning_note:             { type: string }
        learning_explanation:      { type: string }
        opportunity_breakdown:
          $ref: "#/components/schemas/OpportunityBreakdown"
        error:
          type: string
          nullable: true
      required:
        - rank
        - stock
        - sector
        - price
        - best_strategy_id
        - best_strategy_name
        - strategy_type
        - best_regime
        - strategies_tested
        - live_signal
        - signal_reason
        - opportunity_score
        - trade_quality
        - confidence
        - expected_risk
        - expected_reward
        - rr_ratio
        - final_action
        - heat
        - win_rate
        - profit_factor
        - net_pnl_pct
        - total_trades
        - sharpe_ratio
        - entry_price
        - stop_loss
        - target

    SectorStrength:
      type: object
      properties:
        rank:            { type: integer }
        sector:          { type: string }
        stock_count:     { type: integer }
        avg_opportunity: { type: number }
        strong_buys:     { type: integer }
        buys:            { type: integer }
        watches:         { type: integer }
        ignores:         { type: integer }
        strength_label:
          type: string
          enum: [STRONG, NEUTRAL, WEAK]
      required:
        - rank
        - sector
        - stock_count
        - avg_opportunity
        - strong_buys
        - buys
        - watches
        - ignores
        - strength_label

    DashboardSummary:
      type: object
      properties:
        total_scanned:    { type: integer }
        strong_buy_count: { type: integer }
        buy_count:        { type: integer }
        watch_count:      { type: integer }
        ignore_count:     { type: integer }
        strongest_sector: { type: string }
        weakest_sector:   { type: string }
        best_stock:       { type: string }
        best_stock_score: { type: number }
        avg_market_score: { type: number }
        scanned_at:       { type: string }
      required:
        - total_scanned
        - strong_buy_count
        - buy_count
        - watch_count
        - ignore_count
        - strongest_sector
        - weakest_sector
        - best_stock
        - best_stock_score
        - avg_market_score
        - scanned_at

    MarketScanResult:
      type: object
      properties:
        scanned_at:    { type: string }
        universe_size: { type: integer }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScanItem"
        watchlist:
          type: array
          items: { type: string }
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/SectorStrength"
        summary:
          $ref: "#/components/schemas/DashboardSummary"
        learning:
          $ref: "#/components/schemas/LearningMeta"
      required:
        - scanned_at
        - universe_size
        - items
        - watchlist
        - sectors
        - summary

    ReplayItem:
      type: object
      properties:
        stock:               { type: string }
        sector:              { type: string }
        scan_date:           { type: string }
        holding_period:      { type: integer }
        best_strategy_id:    { type: string }
        best_strategy_name:  { type: string }
        historical_action:
          type: string
          enum: [STRONG BUY, BUY, WATCH, IGNORE]
        opportunity_score:   { type: number }
        trade_quality:       { type: number }
        confidence:          { type: number }
        price_on_scan_date:  { type: number }
        price_after_holding:
          type: number
          nullable: true
        return_pct:
          type: number
          nullable: true
        outcome:
          type: string
          enum: [Correct, Wrong, Neutral, Pending]
        outcome_label:
          type: string
          enum: [Excellent, Good, Weak, Small Loss, Failed, Pending]
        why_signal:      { type: string }
        what_happened:   { type: string }
        error:
          type: string
          nullable: true
      required:
        - stock
        - sector
        - scan_date
        - holding_period
        - best_strategy_id
        - best_strategy_name
        - historical_action
        - opportunity_score
        - trade_quality
        - confidence
        - price_on_scan_date
        - price_after_holding
        - return_pct
        - outcome
        - outcome_label
        - why_signal
        - what_happened
        - error

    ReplaySummary:
      type: object
      properties:
        scan_date:           { type: string }
        holding_period:      { type: integer }
        interval:            { type: string }
        total_scanned:       { type: integer }
        buy_signals:         { type: integer }
        watch_signals:       { type: integer }
        ignore_signals:      { type: integer }
        correct_calls:       { type: integer }
        wrong_calls:         { type: integer }
        neutral_calls:       { type: integer }
        accuracy_pct:        { type: number }
        avg_return_pct:      { type: number }
        best_signal:         { type: string }
        best_signal_return:  { type: number }
        worst_signal:        { type: string }
        worst_signal_return: { type: number }
        starting_capital:    { type: number }
        ending_capital:      { type: number }
        total_return_pct:    { type: number }
        expectancy:          { type: number }
        max_drawdown_pct:    { type: number }
        max_consecutive_wins:   { type: integer }
        max_consecutive_losses: { type: integer }
        capital_curve:
          type: array
          items: { type: number }
        reliability_warning:
          type: string
          nullable: true
      required:
        - scan_date
        - holding_period
        - interval
        - total_scanned
        - buy_signals
        - watch_signals
        - ignore_signals
        - correct_calls
        - wrong_calls
        - neutral_calls
        - accuracy_pct
        - avg_return_pct
        - best_signal
        - best_signal_return
        - worst_signal
        - worst_signal_return
        - starting_capital
        - ending_capital
        - total_return_pct
        - expectancy
        - max_drawdown_pct
        - max_consecutive_wins
        - max_consecutive_losses
        - capital_curve
        - reliability_warning

    MarketReplayResult:
      type: object
      properties:
        scan_date:      { type: string }
        holding_period: { type: integer }
        interval:       { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReplayItem"
        summary:
          $ref: "#/components/schemas/ReplaySummary"
      required:
        - scan_date
        - holding_period
        - interval
        - items
        - summary

    OpportunityItem:
      type: object
      properties:
        rank:              { type: integer }
        stock:             { type: string }
        opportunity_score: { type: number }
        confidence:        { type: number }
        expected_risk:     { type: number }
        expected_reward:   { type: number }
        rr_ratio:          { type: number }
        status:
          type: string
          enum: [HOT_BUY, BUY, WATCH, IGNORE]
        entry_price:      { type: number }
        stop_loss:        { type: number }
        target:           { type: number }
        trade_quality:    { type: number }
        tq_grade:         { type: string }
        tq_trend:         { type: number }
        tq_momentum:      { type: number }
        tq_volume:        { type: number }
        tq_breakout:      { type: number }
        tq_risk:          { type: number }
        tq_market:        { type: number }
        suggested_qty:    { type: integer }
        position_value:   { type: number }
        capital_used_pct: { type: number }
        sizing_note:      { type: string }
        feasible:         { type: boolean }
        approve_reasons:  { type: array, items: { type: string } }
        avoid_reasons:    { type: array, items: { type: string } }
        one_liner:        { type: string }
        summary:          { type: string }
        regime:           { type: string }
        ai_decision:      { type: string }
        raw_signal:       { type: string }
      required:
        - rank
        - stock
