    LearningReview:
      type: object
      additionalProperties: true
      properties:
        generated_at:           { type: string }
        mode:                   { type: string }
        active_model_version:   { type: integer }
        active_weights:
          type: object
          additionalProperties: { type: number }
        trades_evaluated:       { type: integer }
        learn_eligible_trades:  { type: integer }
        successful_predictions: { type: integer }
        failed_predictions:     { type: integer }
        avg_prediction_error:   { type: number, nullable: true }
        calibration_score:      { type: number, nullable: true }
        calibration_bands:
          type: array
          items: { $ref: "#/components/schemas/CalibrationBand" }
        common_failure_causes:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              cause:   { type: string }
              count:   { type: integer }
              example: { type: string }
            required: [cause, count, example]
        strongest_success_factors:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              factor:  { type: string }
              count:   { type: integer }
              example: { type: string }
            required: [factor, count, example]
        proposed_adjustments:
          type: array
          items: { $ref: "#/components/schemas/ProposedAdjustment" }
        hypotheses:
          type: array
          items: { $ref: "#/components/schemas/Hypothesis" }
        model_versions:
          type: array
          items: { $ref: "#/components/schemas/ModelVersion" }
        trades:
          type: array
          items: { $ref: "#/components/schemas/LearningReviewTrade" }
        warnings:
          type: array
          items: { type: string }
      required:
        [generated_at, mode, active_model_version, active_weights,
         trades_evaluated, learn_eligible_trades, successful_predictions,
         failed_predictions, calibration_score, calibration_bands,
         common_failure_causes, strongest_success_factors,
         proposed_adjustments, model_versions, trades, warnings]

    LearningCycleResult:
      type: object
      additionalProperties: true
      properties:
        mode:              { type: string }
        evaluated_new:     { type: integer }
        eligible_trades:   { type: integer }
        proposals_created: { type: integer }
        proposals:
          type: array
          items:
            type: object
            additionalProperties: true
        hypotheses_created: { type: integer }
        hypotheses:
          type: array
          items:
            type: object
            additionalProperties: true
        effectiveness_actions:
          type: array
          items:
            type: object
            additionalProperties: true
        calibration:
          type: array
          items: { $ref: "#/components/schemas/CalibrationBand" }
        notes:
          type: array
          items: { type: string }
        warning:           { type: string }
      required:
        [mode, evaluated_new, eligible_trades, proposals_created, proposals,
         calibration, notes, warning]

    Hypothesis:
      type: object
      additionalProperties: true
      properties:
        id:              { type: integer }
        created_at:      { type: string }
        dims:
          type: object
          additionalProperties: { type: string }
        scope_type:      { type: string }
        scope_key:       { type: string }
        statement:       { type: string }
        rationale:       { type: string }
        direction:       { type: string }
        magnitude_pct:   { type: number }
        step_points:     { type: number }
        confidence_pct:  { type: number }
        sample_size:     { type: integer }
        evidence:
          type: object
          additionalProperties: true
          nullable: true
        status:          { type: string }
        applied_version: { type: integer, nullable: true }
        validation:
          type: object
          additionalProperties: true
          nullable: true
        effectiveness:
          type: object
          additionalProperties: true
          nullable: true
      required:
        [id, created_at, scope_type, scope_key, statement, rationale,
         direction, magnitude_pct, step_points, confidence_pct, sample_size,
         status]

    LearningActionResult:
      type: object
      additionalProperties: true
      properties:
        success:       { type: boolean }
        status:        { type: string, nullable: true }
        message:       { type: string }
        model_version: { type: integer, nullable: true }
        validation:
          type: object
          additionalProperties: true
          nullable: true
      required: [success, message]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    StrategyLabRequest:
      type: object
      required: [symbol, start_date, end_date]
      properties:
        symbol:
          type: string
          example: RELIANCE
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        initial_capital:
          type: number
          default: 5000
        interval:
          type: string
          default: "1d"

    StrategyLabEntry:
      type: object
      properties:
        strategy_id:        { type: string }
        strategy_name:      { type: string }
        strategy_type:      { type: string }
        best_regime:        { type: string }
        total_trades:       { type: integer }
        winning_trades:     { type: integer }
        losing_trades:      { type: integer }
        win_rate:           { type: number }
        net_pnl:            { type: number }
        net_pnl_pct:        { type: number }
        profit_factor:      { type: number }
        max_drawdown:       { type: number }
        max_drawdown_pct:   { type: number }
        sharpe_ratio:       { type: number }
        avg_duration_bars:  { type: number }
        best_trade:         { type: number }
        worst_trade:        { type: number }
        error:
          type: string
          nullable: true
      required:
        - strategy_id
        - strategy_name
        - strategy_type
        - best_regime
        - total_trades
        - winning_trades
        - losing_trades
        - win_rate
        - net_pnl
        - net_pnl_pct
        - profit_factor
        - max_drawdown
        - max_drawdown_pct
        - sharpe_ratio
        - avg_duration_bars
        - best_trade
        - worst_trade

    OptimizerRequest:
      type: object
      required: [symbol, start_date, end_date]
      properties:
        symbol:          { type: string, example: RELIANCE }
        start_date:      { type: string, format: date }
        end_date:        { type: string, format: date }
        initial_capital: { type: number, default: 5000 }
        interval:        { type: string, default: "1d" }
        top_n:           { type: integer, default: 10 }

    MultiPeriodEntry:
      type: object
      properties:
        period:           { type: string }
        bars:             { type: integer }
        trades:           { type: integer }
        win_rate:         { type: number }
        net_pnl_pct:      { type: number }
        max_drawdown_pct: { type: number }
        profitable:       { type: boolean }
        skipped:          { type: boolean }
      required: [period, bars, trades, win_rate, net_pnl_pct, max_drawdown_pct, profitable, skipped]

    OptimizerResult:
      type: object
      properties:
        rank:               { type: integer }
        strategy_id:        { type: string }
        strategy_name:      { type: string }
        parameters_display: { type: string }
        parameters:
          type: object
          additionalProperties: true
        total_trades:       { type: integer }
        winning_trades:     { type: integer }
        losing_trades:      { type: integer }
        win_rate:           { type: number }
        net_pnl:            { type: number }
        net_pnl_pct:        { type: number }
        profit_factor:      { type: number }
        max_drawdown:       { type: number }
        max_drawdown_pct:   { type: number }
        sharpe_ratio:       { type: number }
        avg_duration_bars:  { type: number }
        raw_score:              { type: number }
        reliability_label:      { type: string }
        reliability_multiplier: { type: number }
        final_score:            { type: number }
        warning:
          type: string
          nullable: true
        warnings:
          type: array
          items: { type: string }
        multi_period:
          type: array
          items:
            $ref: "#/components/schemas/MultiPeriodEntry"
        profitable_periods: { type: integer }
        total_periods:      { type: integer }
        avg_win_rate_mp:    { type: number }
        avg_drawdown_mp:    { type: number }
        stability_score:    { type: number }
        badge:              { type: string }
      required:
        - rank
        - strategy_id
        - strategy_name
        - parameters_display
        - parameters
        - total_trades
        - winning_trades
        - losing_trades
        - win_rate
        - net_pnl
        - net_pnl_pct
        - profit_factor
        - max_drawdown
        - max_drawdown_pct
        - sharpe_ratio
        - avg_duration_bars
        - raw_score
        - reliability_label
        - reliability_multiplier
        - final_score
        - warnings
        - multi_period
        - profitable_periods
        - total_periods
        - avg_win_rate_mp
        - avg_drawdown_mp
        - stability_score
        - badge
