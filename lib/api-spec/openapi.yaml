openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trading
    description: Paper trading operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /portfolio:
    get:
      operationId: getPortfolio
      tags: [trading]
      summary: Get portfolio state
      description: Returns cash, positions, P&L, and portfolio value in INR
      responses:
        "200":
          description: Portfolio state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /signals:
    get:
      operationId: getSignals
      tags: [trading]
      summary: Get cached signals
      description: Returns signals from the last scan
      responses:
        "200":
          description: List of signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trades:
    get:
      operationId: getTrades
      tags: [trading]
      summary: Get trade history
      description: Returns all paper trades, newest first
      responses:
        "200":
          description: Trade history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /run-scan:
    post:
      operationId: runScan
      tags: [trading]
      summary: Run signal scan
      description: Scans the watchlist for signals using the latest market data
      responses:
        "200":
          description: Scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /watchlist:
    get:
      operationId: getWatchlist
      tags: [trading]
      summary: Get watchlist
      description: Returns current NSE symbol watchlist
      responses:
        "200":
          description: Watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addToWatchlist
      tags: [trading]
      summary: Add symbol to watchlist
      description: Adds an NSE symbol to the watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistAddRequest"
      responses:
        "200":
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /watchlist/{symbol}:
    delete:
      operationId: removeFromWatchlist
      tags: [trading]
      summary: Remove symbol from watchlist
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /opportunity-scan:
    get:
      operationId: getOpportunityScan
      tags: [trading]
      summary: Get ranked opportunity scan
      description: Returns all watchlist stocks ranked by opportunity score
      responses:
        "200":
          description: Ranked opportunity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpportunityItem"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market-context:
    get:
      operationId: getMarketContext
      tags: [trading]
      summary: Get market context
      description: Returns synthesised market score, bias, and sector strength
      responses:
        "200":
          description: Market context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketContext"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai-decisions:
    get:
      operationId: getAiDecisions
      tags: [trading]
      summary: Get cached AI decisions
      description: Returns AI Decision Engine results from the last scan
      responses:
        "200":
          description: List of AI decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiDecision"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trade-replay:
    get:
      operationId: getTradeReplay
      tags: [trading]
      summary: Get trade replay data
      description: Returns completed BUY→SELL round trips with full metadata
      responses:
        "200":
          description: Trade replay items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeReplayItem"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /strategy-performance:
    get:
      operationId: getStrategyPerformance
      tags: [trading]
      summary: Get strategy performance metrics
      description: Returns aggregated win rate, profit factor, best stock, etc.
      responses:
        "200":
          description: Strategy performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyPerformance"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market-overview:
    get:
      operationId: getMarketOverview
      tags: [trading]
      summary: Get market intelligence overview
      description: Returns NIFTY/BANKNIFTY trends, VIX, market regime, and top/weak stocks
      responses:
        "200":
          description: Market overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketOverview"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolio/reset:
    post:
      operationId: resetPortfolio
      tags: [trading]
      summary: Reset portfolio
      description: Resets portfolio to initial ₹5,000 capital with no positions
      responses:
        "200":
          description: Reset confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "500":
          description: Engine error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Signal:
      type: object
      properties:
        stock:
          type: string
          description: NSE symbol
        time:
          type: string
          description: ISO datetime of signal generation
        signal:
          type: string
          enum: [STRONG_BUY, BUY, WATCH, SELL, STRONG_SELL, NO_TRADE]
        quantity:
          type: integer
          description: Suggested number of shares based on available capital
        price:
          type: number
          description: Last traded price in INR
        confidence:
          type: number
          description: Signal confidence score 0–100
        reasons:
          type: array
          items:
            type: string
          description: List of indicator reasons supporting the signal
        risk_level:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          description: Risk level based on ATR volatility
        stop_loss:
          type: number
          description: ATR-based stop loss price in INR
        target:
          type: number
          description: ATR-based target price in INR
        explanation:
          $ref: "#/components/schemas/Explanation"
        timeframe_alignment:
          type: integer
          description: Number of timeframes (0-4) that agree with signal direction
        regime:
          type: string
          description: Market regime active at signal generation time
      required:
        - stock
        - time
        - signal
        - quantity
        - price
        - confidence
        - reasons
        - risk_level
        - stop_loss
        - target
        - explanation
        - timeframe_alignment
        - regime

    Position:
      type: object
      properties:
        symbol:
          type: string
        quantity:
          type: integer
        avg_price:
          type: number
        current_price:
          type: number
        pnl:
          type: number
          description: Unrealised P&L in INR
        pnl_pct:
          type: number
          description: Unrealised P&L percentage
      required:
        - symbol
        - quantity
        - avg_price
        - current_price
        - pnl
        - pnl_pct

    PnlPoint:
      type: object
      properties:
        timestamp:
          type: string
        value:
          type: number
      required:
        - timestamp
        - value

    Portfolio:
      type: object
      properties:
        cash:
          type: number
          description: Available cash in INR
        total_value:
          type: number
          description: Total portfolio value (cash + market value of positions)
        invested_value:
          type: number
          description: Current market value of all open positions
        total_pnl:
          type: number
          description: Overall P&L since inception in INR
        total_pnl_pct:
          type: number
          description: Overall P&L percentage since inception
        positions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        pnl_history:
          type: array
          items:
            $ref: "#/components/schemas/PnlPoint"
      required:
        - cash
        - total_value
        - invested_value
        - total_pnl
        - total_pnl_pct
        - positions
        - pnl_history

    Trade:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        action:
          type: string
          enum: [BUY, SELL]
        quantity:
          type: integer
        price:
          type: number
        total:
          type: number
        timestamp:
          type: string
        reason:
          type: string
      required:
        - id
        - symbol
        - action
        - quantity
        - price
        - total
        - timestamp
        - reason

    TradeQuality:
      type: object
      properties:
        trend_score:    { type: number }
        momentum_score: { type: number }
        volume_score:   { type: number }
        breakout_score: { type: number }
        risk_score:     { type: number }
        market_score:   { type: number }
        total_score:    { type: number }
        grade:          { type: string }
      required:
        - trend_score
        - momentum_score
        - volume_score
        - breakout_score
        - risk_score
        - market_score
        - total_score
        - grade

    PositionSizing:
      type: object
      properties:
        capital:                 { type: number }
        available_cash:          { type: number }
        max_risk_amount:         { type: number }
        stop_distance:           { type: number }
        stop_distance_pct:       { type: number }
        suggested_quantity:      { type: integer }
        position_value:          { type: number }
        expected_profit:         { type: number }
        max_loss:                { type: number }
        rr_ratio:                { type: number }
        capital_utilization_pct: { type: number }
        feasible:                { type: boolean }
        sizing_note:             { type: string }
      required:
        - capital
        - available_cash
        - max_risk_amount
        - stop_distance
        - stop_distance_pct
        - suggested_quantity
        - position_value
        - expected_profit
        - max_loss
        - rr_ratio
        - capital_utilization_pct
        - feasible
        - sizing_note

    ExplainabilityReport:
      type: object
      properties:
        approve_reasons:  { type: array, items: { type: string } }
        avoid_reasons:    { type: array, items: { type: string } }
        recommendation:   { type: string }
        final_confidence: { type: number }
        summary:          { type: string }
        one_liner:        { type: string }
      required:
        - approve_reasons
        - avoid_reasons
        - recommendation
        - final_confidence
        - summary
        - one_liner

    OpportunityItem:
      type: object
      properties:
        rank:              { type: integer }
        stock:             { type: string }
        opportunity_score: { type: number }
        confidence:        { type: number }
        expected_risk:     { type: number }
        expected_reward:   { type: number }
        rr_ratio:          { type: number }
        status:
          type: string
          enum: [HOT_BUY, BUY, WATCH, IGNORE]
        entry_price:      { type: number }
        stop_loss:        { type: number }
        target:           { type: number }
        trade_quality:    { type: number }
        tq_grade:         { type: string }
        tq_trend:         { type: number }
        tq_momentum:      { type: number }
        tq_volume:        { type: number }
        tq_breakout:      { type: number }
        tq_risk:          { type: number }
        tq_market:        { type: number }
        suggested_qty:    { type: integer }
        position_value:   { type: number }
        capital_used_pct: { type: number }
        sizing_note:      { type: string }
        feasible:         { type: boolean }
        approve_reasons:  { type: array, items: { type: string } }
        avoid_reasons:    { type: array, items: { type: string } }
        one_liner:        { type: string }
        summary:          { type: string }
        regime:           { type: string }
        ai_decision:      { type: string }
        raw_signal:       { type: string }
      required:
        - rank
        - stock
        - opportunity_score
        - confidence
        - expected_risk
        - expected_reward
        - rr_ratio
        - status
        - entry_price
        - stop_loss
        - target
        - trade_quality
        - tq_grade
        - tq_trend
        - tq_momentum
        - tq_volume
        - tq_breakout
        - tq_risk
        - tq_market
        - suggested_qty
        - position_value
        - capital_used_pct
        - sizing_note
        - feasible
        - approve_reasons
        - avoid_reasons
        - one_liner
        - summary
        - regime
        - ai_decision
        - raw_signal

    MarketContext:
      type: object
      properties:
        score:               { type: number }
        bias:                { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }
        confidence_modifier: { type: number }
        nifty_price:         { type: number }
        nifty_trend:         { type: string }
        nifty_change_pct:    { type: number }
        banknifty_price:     { type: number }
        banknifty_trend:     { type: string }
        banknifty_change_pct: { type: number }
        vix:                 { type: number }
        vix_category:        { type: string, enum: [LOW, NORMAL, HIGH, EXTREME] }
        market_breadth:      { type: number }
        breadth_label:       { type: string }
        sector_strength:     { type: object, additionalProperties: { type: number } }
        regime:              { type: string }
        computed_at:         { type: string }
      required:
        - score
        - bias
        - confidence_modifier
        - nifty_price
        - nifty_trend
        - nifty_change_pct
        - banknifty_price
        - banknifty_trend
        - banknifty_change_pct
        - vix
        - vix_category
        - market_breadth
        - breadth_label
        - sector_strength
        - regime
        - computed_at

    AiDecision:
      type: object
      properties:
        stock:
          type: string
        raw_signal:
          type: string
        decision:
          type: string
          enum: [STRONG_BUY, BUY, STRONG_SELL, SELL, WATCH, NO_TRADE]
        confidence:
          type: number
        risk_level:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        entry_price:
          type: number
        stop_loss:
          type: number
        target:
          type: number
        rr_ratio:
          type: number
        upgrade_reasons:
          type: array
          items:
            type: string
        downgrade_reasons:
          type: array
          items:
            type: string
        plain_english:
          type: string
        regime:
          type: string
        timeframe_alignment:
          type: integer
        pass_all_rules:
          type: boolean
        time:
          type: string
      required:
        - stock
        - raw_signal
        - decision
        - confidence
        - risk_level
        - entry_price
        - stop_loss
        - target
        - rr_ratio
        - upgrade_reasons
        - downgrade_reasons
        - plain_english
        - regime
        - timeframe_alignment
        - pass_all_rules
        - time

    TradeReplayItem:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        entry_time:
          type: string
        exit_time:
          type: string
        entry_price:
          type: number
        exit_price:
          type: number
        quantity:
          type: integer
        pnl:
          type: number
        pnl_pct:
          type: number
        signal_confidence:
          type: number
        regime:
          type: string
        ai_decision:
          type: string
        rr_ratio:
          type: number
        target:
          type: number
        stop_loss:
          type: number
        exit_type:
          type: string
          enum: [TARGET_HIT, STOP_HIT, SIGNAL_EXIT, MANUAL]
        reason_entry:
          type: string
        reason_exit:
          type: string
        plain_english:
          type: string
      required:
        - id
        - symbol
        - entry_time
        - exit_time
        - entry_price
        - exit_price
        - quantity
        - pnl
        - pnl_pct
        - signal_confidence
        - regime
        - ai_decision
        - rr_ratio
        - target
        - stop_loss
        - exit_type
        - reason_entry
        - reason_exit
        - plain_english

    StrategyPerformance:
      type: object
      properties:
        total_trades:
          type: integer
        winning_trades:
          type: integer
        losing_trades:
          type: integer
        win_rate:
          type: number
        avg_profit:
          type: number
        avg_loss:
          type: number
        profit_factor:
          type: number
        total_pnl:
          type: number
        best_stock:
          type: string
        worst_stock:
          type: string
        best_regime:
          type: string
        computed_at:
          type: string
      required:
        - total_trades
        - winning_trades
        - losing_trades
        - win_rate
        - avg_profit
        - avg_loss
        - profit_factor
        - total_pnl
        - best_stock
        - worst_stock
        - best_regime
        - computed_at

    ScanResult:
      type: object
      properties:
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        ai_decisions:
          type: array
          items:
            $ref: "#/components/schemas/AiDecision"
        scanned_at:
          type: string
      required:
        - signals
        - ai_decisions
        - scanned_at

    WatchlistResponse:
      type: object
      properties:
        watchlist:
          type: array
          items:
            type: string
      required:
        - watchlist

    WatchlistAddRequest:
      type: object
      properties:
        symbol:
          type: string
      required:
        - symbol

    ActionResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    Explanation:
      type: object
      properties:
        trend:
          type: string
        momentum:
          type: string
        volume:
          type: string
        indicator_summary:
          type: string
        regime_impact:
          type: string
        plain_english:
          type: string
      required:
        - trend
        - momentum
        - volume
        - indicator_summary
        - regime_impact
        - plain_english

    StockSnapshot:
      type: object
      properties:
        symbol:
          type: string
        price:
          type: number
        signal:
          type: string
        confidence:
          type: number
        change_pct:
          type: number
      required:
        - symbol
        - price
        - signal
        - confidence
        - change_pct

    MarketOverview:
      type: object
      properties:
        nifty_price:
          type: number
        nifty_change_pct:
          type: number
        nifty_trend:
          type: string
          enum: [UP, DOWN, SIDEWAYS]
        banknifty_price:
          type: number
        banknifty_change_pct:
          type: number
        banknifty_trend:
          type: string
          enum: [UP, DOWN, SIDEWAYS]
        regime:
          type: string
          enum: [BULLISH, BEARISH, SIDEWAYS, HIGH_VOLATILITY, LOW_VOLATILITY]
        regime_description:
          type: string
        vix_value:
          type: number
        vix_status:
          type: string
          enum: [LOW, MODERATE, HIGH, EXTREME]
        market_score:
          type: number
          description: Overall market score 0–100
        top_strong:
          type: array
          items:
            $ref: "#/components/schemas/StockSnapshot"
        top_weak:
          type: array
          items:
            $ref: "#/components/schemas/StockSnapshot"
        scanned_at:
          type: string
      required:
        - nifty_price
        - nifty_change_pct
        - nifty_trend
        - banknifty_price
        - banknifty_change_pct
        - banknifty_trend
        - regime
        - regime_description
        - vix_value
        - vix_status
        - market_score
        - top_strong
        - top_weak
        - scanned_at

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
